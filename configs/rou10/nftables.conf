# /etc/nftables.conf — Rou10
# NAT por masquerading: la subred 192.168.10.0/24 sale a internet por ens32
table ip nat {

        chain prerouting {
                type nat hook prerouting priority filter; policy accept;
        }

        chain postrouting {
                type nat hook postrouting priority srcnat; policy accept;

                oifname "ens32" ip saddr 192.168.10.0/24 counter masquerade
        }
}
